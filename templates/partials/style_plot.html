<div class="style-plot-container">
    <svg viewBox="0 0 100 100" class="style-plot" xmlns="http://www.w3.org/2000/svg">
        <!-- 背景グリッド -->
        <line x1="5" y1="50" x2="95" y2="50" stroke="#374151" stroke-width="0.3" stroke-dasharray="2,2"/>
        <line x1="50" y1="5" x2="50" y2="95" stroke="#374151" stroke-width="0.3" stroke-dasharray="2,2"/>

        {% for point in points %}
        {% if not point.is_result %}
        <!-- 既存スタイル -->
        <circle cx="{{ point.x }}" cy="{{ point.y }}" r="1.8" fill="#86cecb" opacity="0.8"/>
        <text x="{{ point.x }}" y="{{ point.y - 2.5 }}" text-anchor="middle" fill="#9ca3af" font-size="3" font-family="system-ui, sans-serif">{{ point.label }}</text>
        {% endif %}
        {% endfor %}

        {% for point in points %}
        {% if point.is_result %}
        <!-- 演算結果 -->
        <circle cx="{{ point.x }}" cy="{{ point.y }}" r="2.2" fill="#f59e0b" stroke="#fbbf24" stroke-width="0.5"/>
        <text x="{{ point.x }}" y="{{ point.y - 3 }}" text-anchor="middle" fill="#fbbf24" font-size="3.2" font-weight="bold" font-family="system-ui, sans-serif">{{ point.label }}</text>
        {% endif %}
        {% endfor %}
    </svg>
    <div class="plot-legend">
        <span class="legend-item"><span class="legend-dot legend-dot-style"></span> 既存スタイル</span>
        <span class="legend-item"><span class="legend-dot legend-dot-result"></span> 演算結果</span>
    </div>
</div>
