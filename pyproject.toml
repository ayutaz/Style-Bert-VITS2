[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "style-bert-vits2"
dynamic = ["version"]
description = "Style-Bert-VITS2: Bert-VITS2 with more controllable voice styles."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0"
keywords = []
authors = [
    { name = "litagin02", email = "139731664+litagin02@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "cmudict",
    "cn2an",
    "g2p_en",
    "jieba",
    "loguru",
    "nltk<=3.8.1",
    "num2words",
    "numba",
    "numpy<2",
    "onnxruntime",
    "pydantic>=2.0",
    "pyopenjtalk-dict",
    "pypinyin",
    "pyworld-prebuilt",
    "safetensors",
    "transformers",
]

[project.optional-dependencies]
torch = [
    "accelerate",
    "torch>=2.4",
]

[project.urls]
Documentation = "https://github.com/litagin02/Style-Bert-VITS2#readme"
Issues = "https://github.com/litagin02/Style-Bert-VITS2/issues"
Source = "https://github.com/litagin02/Style-Bert-VITS2"

[tool.hatch.version]
path = "style_bert_vits2/constants.py"

[tool.hatch.build.targets.sdist]
only-include = [
    ".vscode",
    "dict_data/default.csv",
    "docs",
    "style_bert_vits2",
    "tests",
    "LGPL_LICENSE",
    "LICENSE",
    "pyproject.toml",
    "README.md",
]
exclude = [".git", ".gitignore", ".gitattributes"]

[tool.hatch.build.targets.wheel]
packages = ["style_bert_vits2"]

[dependency-groups]
# PyTorch CUDA 12.4 ランタイム
cu124 = [
    "accelerate",
    "torch>=2.4",
    "torchaudio>=2.4",
]

# WebUI/APIサーバー依存
webui = [
    "gradio>=4.32",
    "GPUtil",
    "psutil",
    "umap-learn",
]

# 学習パイプライン（cu124 + webui を含む）
train = [
    { include-group = "cu124" },
    { include-group = "webui" },
    "faster-whisper>=1.0.0",
    "librosa==0.9.2",
    "protobuf==4.25",
    "punctuators",
    "pyloudnorm",
    "stable_ts",
    "tensorboard",
    "pyannote.audio>=3.1.0",
]

# 推論のみ（cu124 + webui を含む、学習ツール不要）
infer = [
    { include-group = "cu124" },
    { include-group = "webui" },
    "pyannote.audio>=3.1.0",
]

# ONNX変換・推論ツール
onnx = [
    "onnx",
    "onnxconverter-common",
    "onnxsim-prebuilt",
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime-gpu; sys_platform != 'darwin'",
]

# テスト
test = [
    "coverage[toml]>=6.5",
    "pytest",
    "scipy",
]

# コードスタイル
style = [
    "black[jupyter]",
    "isort",
]

# 開発環境（全部入り）
dev = [
    { include-group = "train" },
    { include-group = "onnx" },
    { include-group = "test" },
    { include-group = "style" },
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[tool.coverage.run]
source_pkgs = ["style_bert_vits2", "tests"]
branch = true
parallel = true
omit = ["style_bert_vits2/constants.py"]

[tool.coverage.paths]
style_bert_vits2 = ["style_bert_vits2", "*/style-bert-vits2/style_bert_vits2"]
tests = ["tests", "*/style-bert-vits2/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
extend-select = ["I"]

[tool.ruff.lint.isort]
lines-after-imports = 2