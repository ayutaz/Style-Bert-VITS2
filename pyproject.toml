[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "style-bert-vits2"
dynamic = ["version"]
description = "Style-Bert-VITS2: Bert-VITS2 with more controllable voice styles."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"
keywords = []
authors = [
    { name = "litagin02", email = "139731664+litagin02@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "cmudict",
    "cn2an",
    "g2p_en",
    "jieba",
    "loguru",
    "nltk<=3.8.1",
    "num2words",
    "numba",
    "numpy<2",
    "onnxruntime",
    "pydantic>=2.0",
    "pyopenjtalk-plus",
    "pypinyin",
    "pyworld-prebuilt",
    "safetensors",
    "transformers",
]

[project.optional-dependencies]
torch = [
    "accelerate",
    "torch>=2.4",
]

[project.urls]
Documentation = "https://github.com/litagin02/Style-Bert-VITS2#readme"
Issues = "https://github.com/litagin02/Style-Bert-VITS2/issues"
Source = "https://github.com/litagin02/Style-Bert-VITS2"

[tool.hatch.version]
path = "style_bert_vits2/constants.py"

[tool.hatch.build.targets.sdist]
only-include = [
    ".vscode",
    "dict_data/default.csv",
    "docs",
    "style_bert_vits2",
    "tests",
    "LGPL_LICENSE",
    "LICENSE",
    "pyproject.toml",
    "README.md",
]
exclude = [".git", ".gitignore", ".gitattributes"]

[tool.hatch.build.targets.wheel]
packages = ["style_bert_vits2"]

[dependency-groups]
# PyTorch CUDA 12.4 ランタイム
cu124 = [
    "accelerate",
    "torch>=2.4",
    "torchaudio>=2.4",
]

# WebUI/APIサーバー依存
webui = [
    "gradio>=4.32",
    "GPUtil",
    "jinja2",
    "psutil",
    "umap-learn",
]

# 推論（cu124 + webui を含む）
infer = [
    { include-group = "cu124" },
    { include-group = "webui" },
    "pyannote.audio>=3.1.0",
]

# ONNX変換・推論ツール
onnx = [
    "onnx",
    "onnxconverter-common",
    "onnxsim-prebuilt",
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime-gpu; sys_platform != 'darwin'",
]

# テスト
test = [
    "coverage[toml]>=6.5",
    "pytest",
    "scipy",
]

# コードスタイル
style = [
    "ruff",
]

# 開発環境（全部入り）
dev = [
    { include-group = "infer" },
    { include-group = "onnx" },
    { include-group = "test" },
    { include-group = "style" },
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[tool.coverage.run]
source_pkgs = ["style_bert_vits2", "tests"]
branch = true
parallel = true
omit = ["style_bert_vits2/constants.py"]

[tool.coverage.paths]
style_bert_vits2 = ["style_bert_vits2", "*/style-bert-vits2/style_bert_vits2"]
tests = ["tests", "*/style-bert-vits2/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff独自ルール
]
ignore = [
    "E501",    # line-too-long (formatterに任せる)
    "B905",    # zip-without-explicit-strict (既存コードで大量使用、strict=True追加は動作変更リスクあり)
    "RUF001",  # 日本語文字列中のUnicode（日本語プロジェクトでは正常）
    "RUF002",  # 日本語docstring中のUnicode
    "RUF003",  # 日本語コメント中のUnicode
    "RUF005",  # collection-literal-concatenation (スタイル的な好みで既存コードの可読性を維持)
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "RUF028", "RUF059", "SIM108"]
"style_bert_vits2/models/**" = ["E741", "E722", "B006", "B007", "B904", "E712", "SIM", "RUF034", "RUF059"]
"style_bert_vits2/nlp/**" = ["E741", "E722", "E731", "B007", "B904", "SIM", "RUF017", "RUF028", "UP030", "UP031", "UP035", "UP042"]
"style_bert_vits2/utils/strenum.py" = ["UP031", "UP042", "SIM102"]
"style_bert_vits2/utils/stdout_wrapper.py" = ["F401", "SIM115"]
